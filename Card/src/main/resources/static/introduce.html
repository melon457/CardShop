<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사이트 소개</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      width: 100% !important;
    }

    .hero-section {
      width: 100% !important;
      min-height: calc(100vh - 80px);
      display: flex !important;
      flex-direction: column !important;
      justify-content: center !important;
      align-items: center !important;
      text-align: center;
      padding: 0 20px;
      box-sizing: border-box;
    }

    .hero-title {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.3;
      text-align: center;
    }

    .hero-subtitle {
      font-size: 20px;
      color: #a1a1aa;
      max-width: 600px;
      line-height: 1.6;
      margin-bottom: 60px;
    }

    .scroll-hint {
      font-size: 15px;
      color: #71717a;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      animation: bounce 2s infinite;
    }

    .scroll-hint span {
      font-size: 24px;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-10px); }
      60% { transform: translateY(-5px); }
    }

    .intro-container {
      width: 100% !important;
      max-width: 900px;
      margin: 0 auto;
      padding: 100px 20px 250px 20px;
      display: flex !important;
      flex-direction: column !important;
      gap: 140px;
      box-sizing: border-box;
    }

    .intro-box {
      width: 100%;
      box-sizing: border-box;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 40px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .intro-box h2 {
      font-size: 28px;
      margin-bottom: 16px;
      color: #fff;
    }

    .intro-box p {
      font-size: 16px;
      line-height: 1.8;
      color: #a1a1aa;
    }

    .scroll-item {
      opacity: 0;
      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), 
                  opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform, opacity;
    }

    .scroll-item.from-left {
      transform: translateX(-100px);
    }

    .scroll-item.from-right {
      transform: translateX(100px);
    }

    .scroll-item.visible {
      opacity: 1;
      transform: translateX(0);
    }
  </style>
</head>
<body>

  <div class="bg-glow bg-glow--1"></div>
  <div class="bg-glow bg-glow--2"></div>

  <header class="navbar" style="width: 100%;">
    <div class="navbar__logo">
      <a href="index.html" style="color:inherit; text-decoration:none;">CRUD사이트</a>
    </div>
    <nav class="navbar__menu">
      <a href="introduce.html" class="nav-btn active">사이트 소개</a>
      <a href="shop.html" class="nav-btn">카드 상점</a>
      <a href="collection.html" class="nav-btn">보관함</a>
      <a href="sell.html" class="nav-btn">카드 판매</a>
      <a href="reviews.html" class="nav-btn">상품평</a>
    </nav>
  </header>

  <section class="hero-section">
    <h1 class="hero-title">사이트 소개<br>CRUD 사이트</h1>
    <p class="hero-subtitle">
      배경음악, 구매, 보관, 판매, 상품평<br>
    </p>
    <div class="scroll-hint">
        더 알아보기
      <span>↓</span>
    </div>
  </section>

  <main class="intro-container">

    <section class="scroll-item from-right intro-box">
      <h2>🎵 배경음악</h2>
      <p>
        YouTube IFrame Player API를 받아와 배경음악(fromis_9 - LIKE YOU BETTER)재생
      </p>
    </section>

    <section class="scroll-item from-left intro-box">
      <h2>🛒 카드 상점</h2>
      <p>
        카드 상점에서 카드를 구매할수 있습니다
      </p>
    </section>

    <section class="scroll-item from-right intro-box">
      <h2>💼 나만의 보관함</h2>
      <p>
        보유한 카드는 보관함에서 구경할수 있습니다
      </p>
    </section>

    <section class="scroll-item from-left intro-box">
      <h2>💰 카드 판매</h2>
      <p>
        필요없는 카드는 판매할수 있습니다
      </p>
    </section>

    <section class="scroll-item from-right intro-box">
      <h2>💬상품평 공유</h2>
      <p>
        CRUD가 모두 들어가 있는 상품평공유 시스템입니다
      </p>
    </section>

  </main>

  <script>
    function checkScroll() {
      const items = document.querySelectorAll('.scroll-item');
      const windowHeight = window.innerHeight;

      items.forEach(item => {
        const rect = item.getBoundingClientRect();

        const isInView = (rect.top < windowHeight * 0.85) && (rect.bottom > windowHeight * 0.15);

        if (isInView) {
          item.classList.add('visible');
        } else {
          item.classList.remove('visible');
        }
      });
    }

    window.addEventListener('scroll', checkScroll);
    window.addEventListener('DOMContentLoaded', checkScroll);
  </script>
  <div id="yt-player" style="display:none;"></div>
  <button id="bgm-toggle-btn" class="bgm-btn" onclick="toggleBGM()">🎵 BGM ON</button>
  <script src="js/bgm.js"></script>

</body>
</html>
