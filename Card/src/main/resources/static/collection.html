<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>내 보관함</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="bg-glow bg-glow--1"></div>
    <div class="bg-glow bg-glow--2"></div>

    <header class="navbar">
        <div class="navbar__logo"><a href="/" style="color:inherit; text-decoration:none;">PhotoCss</a></div>
        <nav class="navbar__menu">
            <a href="/shop.html" class="nav-btn">카드 상점</a>
            <a href="/collection.html" class="nav-btn active">보관함</a>
            <a href="/sell.html" class="nav-btn">카드 판매</a>
            <a href="/reviews.html" class="nav-btn">상품평</a>
        </nav>
    </header>

    <div class="container">
        <div class="section-title">
            <h2>🎴 내 보관함</h2>
            <p>DB에 저장된 구매한 카드 목록입니다.</p>
        </div>

        <div class="gallery" id="collection-list">
            <!-- 자바스크립트로 자동 로딩 -->
        </div>
    </div>

    <script>
        async function loadCollection() {
            try {
                const res = await fetch('/api/cards/purchased');
                const cards = await res.json();
                const container = document.getElementById('collection-list');
                container.innerHTML = '';

                if (cards.length === 0) {
                    container.innerHTML = '<p style="color:#71717a;">보관된 카드가 없습니다.</p>';
                    return;
                }

                cards.forEach(card => {
                    const cardEl = document.createElement('div');
                    cardEl.className = 'card-item';
                    cardEl.innerHTML = `
                        <div class="card-item__inner">
                            <img src="${card.imgUrl}" alt="${card.cardName}">
                        </div>
                    `;
                    container.appendChild(cardEl);
                });
            } catch (err) {
                console.error(err);
            }
        }

        document.addEventListener('DOMContentLoaded', loadCollection);
    </script>
</body>
</html>
