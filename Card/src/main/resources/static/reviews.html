<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhotoCss - 상품평</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .bg-glow {
      pointer-events: none !important;
    }
    .navbar {
      position: relative !important;
      z-index: 9999 !important;
    }
  </style>
</head>
<body>

  <div class="bg-glow bg-glow--1"></div>
  <div class="bg-glow bg-glow--2"></div>

  <header class="navbar">
    <div class="navbar__logo">
      <a href="./index.html" style="color:inherit; text-decoration:none;">CRUD사이트</a>
    </div>

    <nav class="navbar__menu">
      <a href="shop.html" class="nav-btn">카드 구매</a>
      <a href="collection.html" class="nav-btn">내 보관함</a>
      <a href="sell.html" class="nav-btn">카드 판매</a>
      <a href="reviews.html" class="nav-btn active">상품평</a>
    </nav>
  </header>

  <main class="container">
    <div class="section-title">
      <h2>상품평</h2>
      <p>구매하신 포토카드에 대한 후기를 자유롭게 남겨주세요.</p>
    </div>

    <form id="review-form" class="review-form">
      <input type="hidden" id="review-id" value="">
      <input type="text" id="buyer-name" placeholder="구매자 이름" required>
      <textarea id="review-content" placeholder="후기 내용을 작성해주세요." rows="3" required></textarea>
      <button type="submit" id="review-submit-btn" class="ui-btn">리뷰 등록</button>
    </form>
    <div id="review-list" class="review-list"></div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
