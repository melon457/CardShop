<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카드 판매</title>
    <link rel="stylesheet" href="./css/style.css">
    <style>
        .modal__content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            z-index: 1001;
            position: relative;
        }

        .modal__card {
            position: relative;
            z-index: 1;
        }

        .modal__card * {
            pointer-events: none;
        }

        /* 카드 판매 버튼 레이어 최상단 설정 */
        .modal__action {
            display: flex;
            justify-content: center;
            width: 100%;
            position: relative;
            z-index: 100;
        }

        .sell-modal-btn {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: #fff;
            border: none;
            padding: 12px 32px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4);
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        .sell-modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(220, 38, 38, 0.6);
        }
    </style>
</head>
<body>
    <div class="bg-glow bg-glow--1"></div>
    <div class="bg-glow bg-glow--2"></div>

    <header class="navbar">
        <div class="navbar__logo"><a href="./index.html" style="color:inherit; text-decoration:none;">CRUD사이트</a></div>
        <nav class="navbar__menu">
            <a href="./introduce.html" class="nav-btn">사이트 소개</a>
            <a href="./shop.html" class="nav-btn">카드 상점</a>
            <a href="./collection.html" class="nav-btn">보관함</a>
            <a href="./sell.html" class="nav-btn active">카드 판매</a>
            <a href="./reviews.html" class="nav-btn">상품평</a>
        </nav>
    </header>

    <div class="container">
        <div class="section-title">
            <h2>💰 카드 판매</h2>
        </div>

        <div class="gallery" id="sell-list"></div>
    </div>

    <div class="modal" id="cardModal">
        <div class="modal__backdrop" onclick="closeModal()"></div>

        <div class="modal__content-wrapper">
            <div class="modal__card" id="modalCard">
                <div class="modal__card-inner" id="cardInner">
                    <div class="modal__card-face modal__card-front">
                        <img id="modalImg" src="" alt="Card">
                        <div class="modal__card-glare" id="modalGlare"></div>
                    </div>
                    <div class="modal__card-face modal__card-back"></div>
                </div>
            </div>

            <div class="modal__action">
                <button class="sell-modal-btn" onclick="sellCurrentCard()">💰 카드 판매하기</button>
            </div>
        </div>
    </div>

    <script>
        let currentCardId = null, currentCardName = '';

        async function loadSellCards() {
            try {
                const res = await fetch('/api/cards/purchased');
                const cards = await res.json();
                const container = document.getElementById('sell-list');
                container.innerHTML = '';

                if (cards.length === 0) {
                    container.innerHTML = '<p style="color:#71717a;">판매할 카드가 없습니다.</p>';
                    return;
                }

                cards.forEach(card => {
                    const cardEl = document.createElement('div');
                    cardEl.className = 'card-item';
                    cardEl.onclick = () => open3DModal(card.id, card.cardName, card.imgUrl);
                    cardEl.innerHTML = `<div class="card-item__inner"><img src="${card.imgUrl}" alt="${card.cardName}"></div>`;
                    container.appendChild(cardEl);
                });
            } catch (err) {
                console.error(err);
            }
        }

        function open3DModal(id, cardName, imgUrl) {
            currentCardId = id;
            currentCardName = cardName;
            document.getElementById('modalImg').src = imgUrl;
            document.getElementById('cardModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('cardModal').classList.remove('active');
        }

        async function sellCurrentCard() {
            if (!currentCardId) return;
            if (!confirm(`정말 판매하시겠습니까?`)) return;

            try {
                const res = await fetch(`/api/cards/sell/${currentCardId}`, { method: 'DELETE' });
                if (res.ok) {
                    alert('판매됨');
                    closeModal();
                    loadSellCards();
                } else {
                    alert('판매 실패');
                }
            } catch (err) {
                alert('서버 통신 중 오류가 발생했습니다.');
            }
        }

        document.addEventListener('DOMContentLoaded', loadSellCards);
    </script>
    <div id="yt-player" style="display:none;"></div>
    <button id="bgm-toggle-btn" class="bgm-btn" onclick="toggleBGM()">🎵 BGM OFF</button>
    <script src="js/bgm.js"></script>
</body>
</html>
