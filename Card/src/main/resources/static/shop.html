<!DOCTYPE html>

    <link rel="stylesheet" href="./css/style.css">
    <style>
        .modal__content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            z-index: 1001;
            position: relative;
            perspective: 1000px; 
        }
        .modal__card-front * {
            pointer-events: none;
        }

        .modal__action {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .buy-modal-btn {
            background: linear-gradient(135deg, #0070f3 0%, #7928ca 100%);
            color: #fff;
            border: none;
            padding: 12px 32px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 112, 243, 0.4);
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        .buy-modal-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 25px rgba(121, 40, 202, 0.6);
        }

        /* 사진 하단 평균 별점 표시 스타일 */
        .card-avg-rating {
            margin-top: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #fbbf24;
            text-align: center;
        }

        /* 3D 모달 카드 뒷면 별점 평가 영역 스타일 */
        .modal__card-back {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(20, 24, 38, 0.95);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .rating-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .rating-title {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
        }

        .star-rating {
            display: flex;
            gap: 6px;
            cursor: pointer;
        }

        .star-rating .star {
            font-size: 24px;
            color: #4b5563;
            transition: color 0.15s ease;
            user-select: none;
        }

        .star-rating .star.active {
            color: #fbbf24;
            filter: drop-shadow(0 0 6px rgba(251, 191, 36, 0.6));
        }

        .submit-rating-btn {
            margin-top: 6px;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 600;
            background: linear-gradient(135deg, #0070f3 0%, #7928ca 100%);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .submit-rating-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>

    <div class="modal" id="cardModal">
        <div class="modal__backdrop" onclick="closeModal()"></div>
        
        <div class="modal__content-wrapper">
            <div class="modal__card" id="modalCard">
                <div class="modal__card-inner" id="cardInner">
                    <div class="modal__card-face modal__card-front">
                        <img id="modalImg" src="" alt="Card">
                        <div class="modal__card-glare" id="modalGlare"></div>
                    </div>
                    <!-- 모달에서 카드를 클릭하여 뒤집었을 때 나오는 별점 작성 영역 -->
                    <div class="modal__card-face modal__card-back">
                        <div class="rating-box">
                            <span class="rating-title">별점 평가</span>
                            <div class="star-rating" id="modalStarRating">
                                <span class="star" data-value="1">★</span>
                                <span class="star" data-value="2">★</span>
                                <span class="star" data-value="3">★</span>
                                <span class="star" data-value="4">★</span>
                                <span class="star" data-value="5">★</span>
                            </div>
                            <button class="submit-rating-btn" onclick="submitCurrentRating()">별점 등록</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal__action">
                <button class="buy-modal-btn" onclick="buyCurrentCard()">🛒 카드 구매하기</button>
            </div>
        </div>
    </div>

    <script>
        let currentCardName = '', currentImgUrl = '', currentCardKey = '';
        let isFlipped = false;
        let selectedRatingValue = 0;

        document.addEventListener('DOMContentLoaded', () => {
            // 1. 페이지 로드 시 상점에 있는 모든 카드의 평균 별점을 DB에서 불러옴
            const cardItems = document.querySelectorAll('.card-item');
            cardItems.forEach(item => {
                const img = item.querySelector('img');
                if (img && img.src) {
                    const cardKey = getCardKeyFromUrl(img.src);
                    if (cardKey) {
                        loadAverageRating(cardKey);
                    }
                }
            });

            // 2. 모달 별점 클릭 이벤트 세팅
            setupStarRating();
        });

        function getCardKeyFromUrl(url) {
            const filename = url.split('/').pop();
            return filename.replace('.png', '').replace('.jpg', '');
        }

        function open3DModal(cardName, imgUrl) {
            currentCardName = cardName;
            currentImgUrl = imgUrl;
            currentCardKey = getCardKeyFromUrl(imgUrl);

            document.getElementById('modalImg').src = imgUrl;
            document.getElementById('cardModal').classList.add('active');
            resetCard3D();
            resetModalStars();
        }

        function closeModal() {
            document.getElementById('cardModal').classList.remove('active');
            resetCard3D();
        }

        function resetCard3D() {
            isFlipped = false;
            document.getElementById('cardInner').style.transform = 'rotateY(0deg)';
            document.getElementById('modalCard').style.transform = 'rotateX(0deg) rotateY(0deg)';
            document.getElementById('modalGlare').style.opacity = '0';
        }

        const modalCard = document.getElementById('modalCard');
        const modalGlare = document.getElementById('modalGlare');
        const cardInner = document.getElementById('cardInner');
        let cardRect = null;

        modalCard.addEventListener('mouseenter', () => {
            cardRect = modalCard.getBoundingClientRect();
        });

        modalCard.addEventListener('mousemove', (e) => {
            if (!cardRect) cardRect = modalCard.getBoundingClientRect();

            const x = e.clientX - cardRect.left;
            const y = e.clientY - cardRect.top;
            const centerX = cardRect.width / 2;
            const centerY = cardRect.height / 2;

            const rotateX = ((y - centerY) / centerY) * -18;
            const rotateY = ((x - centerX) / centerX) * 18;

            modalCard.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            modalGlare.style.opacity = '1';
            modalGlare.style.backgroundPosition = `${(x / cardRect.width) * 100}% ${(y / cardRect.height) * 100}%`;
        });

        modalCard.addEventListener('mouseleave', () => {
            cardRect = null;
            modalCard.style.transform = 'rotateX(0deg) rotateY(0deg)';
            modalGlare.style.opacity = '0';
        });

        // 카드 클릭 시 3D 회전 (별점 박스나 버튼 클릭 시에는 회전 방지)
        modalCard.addEventListener('click', (e) => {
            if (e.target.closest('.rating-box') || e.target.closest('button')) return;
            isFlipped = !isFlipped;
            cardInner.style.transform = isFlipped ? 'rotateY(180deg)' : 'rotateY(0deg)';
        });

        // 카드 구매 기능 (POST /api/cards/purchase)
        async function buyCurrentCard() {
            if (!confirm(`[${currentCardName}] 카드를 구매하시겠습니까?`)) return;

            try {
                const response = await fetch('/api/cards/purchase', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cardName: currentCardName, imgUrl: currentImgUrl })
                });

                if (response.ok) {
                    alert('구매 성공! 보관함에서 확인하실 수 있습니다.');
                    closeModal();
                } else {
                    alert('구매 실패');
                }
            } catch (err) {
                alert('서버 통신 오류가 발생했습니다.');
            }
        }

        // 별점 UI 클릭 인터랙션
        function setupStarRating() {
            const stars = document.querySelectorAll('#modalStarRating .star');
            stars.forEach(star => {
                star.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectedRatingValue = parseInt(star.getAttribute('data-value'));
                    updateModalStarUI(selectedRatingValue);
                });
            });
        }

        function updateModalStarUI(value) {
            const stars = document.querySelectorAll('#modalStarRating .star');
            stars.forEach(s => {
                if (parseInt(s.getAttribute('data-value')) <= value) {
                    s.classList.add('active');
                } else {
                    s.classList.remove('active');
                }
            });
        }

        function resetModalStars() {
            selectedRatingValue = 0;
            updateModalStarUI(0);
        }

        // 별점 등록 API 요청 (POST /api/ratings)
        async function submitCurrentRating() {
            if (!selectedRatingValue || selectedRatingValue === 0) {
                alert("별점을 선택해주세요.");
                return;
            }

            try {
                const response = await fetch('/api/ratings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cardName: currentCardKey, rating: selectedRatingValue })
                });

                if (response.ok) {
                    const data = await response.json();
                    alert("별점이 성공적으로 등록되었습니다!");
                    updateAvgDisplay(currentCardKey, data.averageRating);
                } else {
                    alert("별점 등록에 실패했습니다.");
                }
            } catch (err) {
                console.error("별점 등록 오류:", err);
                alert("서버 통신 오류가 발생했습니다.");
            }
        }

        // 서버에서 카드 평균 별점 조회 (GET /api/ratings/{cardKey}/average)
        async function loadAverageRating(cardKey) {
            try {
                const res = await fetch(`/api/ratings/${cardKey}/average`);
                if (res.ok) {
                    const data = await res.json();
                    updateAvgDisplay(cardKey, data.averageRating);
                }
            } catch (err) {
                console.error("평균 별점 조회 실패:", err);
            }
        }

        // 사진 하단에 평균 별점 출력
        function updateAvgDisplay(cardKey, avgRating) {
            const avgScoreElem = document.querySelector(`#avg-rating-${cardKey} .avg-score`);
            if (avgScoreElem) {
                avgScoreElem.textContent = `★ ${Number(avgRating).toFixed(1)}`;
            }
        }
    </script>

    <button id="bgm-toggle-btn" class="bgm-btn" onclick="toggleBGM()">🎵 BGM ON</button>
