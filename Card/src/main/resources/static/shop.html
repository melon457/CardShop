<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카드 상점</title>
    <link rel="stylesheet" href="./css/style.css">
    <style>
        /* 모달 레이아웃: 좌측(카드+구매버튼) / 우측(별점 평가 패널) */
        .modal__content-wrapper {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 32px;
            z-index: 1001;
            position: relative;
        }

        .modal__left-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            position: relative;
        }

        /* 모달 카드 (3D 기울임 제거, 깔끔한 레이아웃 유지) */
        .modal__card {
            position: relative;
            z-index: 1;
        }

        .modal__card * {
            pointer-events: none;
        }

        /* 카드 구매 버튼 영역 - 최상단 레이어 배치 */
        .modal__action {
            display: flex;
            justify-content: center;
            width: 100%;
            position: relative;
            z-index: 100;
        }

        .buy-modal-btn {
            background: linear-gradient(135deg, #0070f3 0%, #7928ca 100%);
            color: #fff;
            border: none;
            padding: 12px 32px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 112, 243, 0.4);
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        .buy-modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(121, 40, 202, 0.6);
        }

        /* 오른쪽 별점 평가 패널 */
        .modal__rating-panel {
            background: rgba(18, 20, 29, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 24px 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            min-width: 220px;
            z-index: 100;
        }

        .rating-panel-title {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
        }

        .star-rating {
            display: flex;
            gap: 6px;
            cursor: pointer;
        }

        .star-rating .star {
            font-size: 28px;
            color: #4b5563;
            transition: color 0.15s ease, transform 0.15s ease;
            user-select: none;
        }

        .star-rating .star:hover,
        .star-rating .star.active {
            color: #fbbf24;
            filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.6));
            transform: scale(1.1);
        }

        .submit-rating-btn {
            padding: 10px 22px;
            font-size: 14px;
            font-weight: 700;
            background: linear-gradient(135deg, #0070f3 0%, #7928ca 100%);
            color: #ffffff;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 112, 243, 0.3);
        }

        .submit-rating-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(121, 40, 202, 0.5);
        }

        /* 카드 하단 평균 별점 표시 스타일 */
        .card-avg-rating {
            margin-top: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #fbbf24;
            text-align: center;
        }

        @media (max-width: 650px) {
            .modal__content-wrapper {
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>

    <div class="modal" id="cardModal">
        <div class="modal__backdrop" onclick="closeModal()"></div>
        
        <div class="modal__content-wrapper">
            <!-- 좌측: 모달 카드 & 구매하기 버튼 -->
            <div class="modal__left-col">
                <div class="modal__card" id="modalCard">
                    <div class="modal__card-inner" id="cardInner">
                        <div class="modal__card-face modal__card-front">
                            <img id="modalImg" src="" alt="Card">
                            <div class="modal__card-glare" id="modalGlare"></div>
                        </div>
                        <div class="modal__card-face modal__card-back"></div>
                    </div>
                </div>

                <div class="modal__action">
                    <button class="buy-modal-btn" onclick="buyCurrentCard()">🛒 카드 구매하기</button>
                </div>
            </div>

            <!-- 우측: 별점 평가 패널 -->
            <div class="modal__rating-panel">
                <span class="rating-panel-title">⭐ 카드 별점 남기기</span>
                <div class="star-rating" id="modalStarRating">
                    <span class="star" data-value="1">★</span>
                    <span class="star" data-value="2">★</span>
                    <span class="star" data-value="3">★</span>
                    <span class="star" data-value="4">★</span>
                    <span class="star" data-value="5">★</span>
                </div>
                <button class="submit-rating-btn" onclick="submitCurrentRating()">별점 등록</button>
            </div>
        </div>
    </div>

    <script>
        let currentCardName = '', currentImgUrl = '', currentCardKey = '';
        let selectedRatingValue = 0;

        document.addEventListener('DOMContentLoaded', () => {
            // 1. 상점 카드들의 평균 별점 조회
            const cardItems = document.querySelectorAll('.card-item');
            cardItems.forEach(item => {
                const img = item.querySelector('img');
                if (img && img.src) {
                    const cardKey = getCardKeyFromUrl(img.src);
                    if (cardKey) {
                        loadAverageRating(cardKey);
                    }
                }
            });

            // 2. 별점 이벤트 세팅
            setupStarRating();
        });

        function getCardKeyFromUrl(url) {
            const filename = url.split('/').pop();
            return filename.replace('.png', '').replace('.jpg', '');
        }

        function open3DModal(cardName, imgUrl) {
            currentCardName = cardName;
            currentImgUrl = imgUrl;
            currentCardKey = getCardKeyFromUrl(imgUrl);

            document.getElementById('modalImg').src = imgUrl;
            document.getElementById('cardModal').classList.add('active');
            resetModalStars();
        }

        function closeModal() {
            document.getElementById('cardModal').classList.remove('active');
        }

        // 카드 구매 API 요청 (POST /api/cards/purchase)
        async function buyCurrentCard() {
            if (!confirm(`카드를 구매하시겠습니까?`)) return;

            try {
                const response = await fetch('/api/cards/purchase', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cardName: currentCardName, imgUrl: currentImgUrl })
                });

                if (response.ok) {
                    alert('구매 성공');
                    closeModal();
                } else {
                    alert('구매 실패');
                }
            } catch (err) {
                alert('서버 통신 오류가 발생했습니다.');
            }
        }

        // 별점 클릭 UI 핸들러
        function setupStarRating() {
            const stars = document.querySelectorAll('#modalStarRating .star');
            stars.forEach(star => {
                star.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectedRatingValue = parseInt(star.getAttribute('data-value'));
                    updateModalStarUI(selectedRatingValue);
                });
            });
        }

        function updateModalStarUI(value) {
            const stars = document.querySelectorAll('#modalStarRating .star');
            stars.forEach(s => {
                if (parseInt(s.getAttribute('data-value')) <= value) {
                    s.classList.add('active');
                } else {
                    s.classList.remove('active');
                }
            });
        }

        function resetModalStars() {
            selectedRatingValue = 0;
            updateModalStarUI(0);
        }

        // 별점 등록 API 요청 (POST /api/ratings)
        async function submitCurrentRating() {
            if (!selectedRatingValue || selectedRatingValue === 0) {
                alert("별점을 선택해주세요.");
                return;
            }

            try {
                const response = await fetch('/api/ratings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cardName: currentCardKey, rating: selectedRatingValue })
                });

                if (response.ok) {
                    const data = await response.json();
                    alert("별점이 성공적으로 등록되었습니다!");
                    updateAvgDisplay(currentCardKey, data.averageRating);
                } else {
                    alert("별점 등록에 실패했습니다.");
                }
            } catch (err) {
                console.error("별점 등록 오류:", err);
                alert("서버 통신 오류가 발생했습니다.");
            }
        }
        async function loadAverageRating(cardKey) {
            try {
                const res = await fetch(`/api/ratings/${cardKey}/average`);
                if (res.ok) {
                    const data = await res.json();
                    updateAvgDisplay(cardKey, data.averageRating);
                }
            } catch (err) {
                console.error("평균 별점 조회 실패:", err);
            }
        }

        function updateAvgDisplay(cardKey, avgRating) {
            const avgScoreElem = document.querySelector(`#avg-rating-${cardKey} .avg-score`);
            if (avgScoreElem) {
                avgScoreElem.textContent = `★ ${Number(avgRating).toFixed(1)}`;
            }
        }
    </script>

    <div id="yt-player" style="display:none;"></div>
    <button id="bgm-toggle-btn" class="bgm-btn" onclick="toggleBGM()">🎵 BGM ON</button>
    <script src="js/bgm.js"></script>
</body>
