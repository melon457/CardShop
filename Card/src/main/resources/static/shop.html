<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카드 상점</title>
    <link rel="stylesheet" href="./css/style.css">
    <style>
        .modal__content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            z-index: 1001;
            position: relative;
            perspective: 1000px; 
        }
        .modal__card * {
            pointer-events: none;
        }

        .modal__action {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .buy-modal-btn {
            background: linear-gradient(135deg, #0070f3 0%, #7928ca 100%);
            color: #fff;
            border: none;
            padding: 12px 32px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 112, 243, 0.4);
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        .buy-modal-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 25px rgba(121, 40, 202, 0.6);
        }
</style>
</head>
<body>
    <div class="bg-glow bg-glow--1"></div>
    <div class="bg-glow bg-glow--2"></div>

    <header class="navbar">
        <div class="navbar__logo"><a href="./index.html" style="color:inherit; text-decoration:none;">CRUD사이트</a></div>
        <nav class="navbar__menu">
            <a href="./shop.html" class="nav-btn active">카드 상점</a>
            <a href="./collection.html" class="nav-btn">보관함</a>
            <a href="./sell.html" class="nav-btn">카드 판매</a>
            <a href="./reviews.html" class="nav-btn">상품평</a>
        </nav>
    </header>

    <div class="container">
        <div class="section-title">
            <h2>🛒 카드 상점</h2>
        </div>
        <div class="gallery">
    <!-- 기존 카드 5개 -->
    <div class="card-item" onclick="open3DModal('Back Card', './image/back.png')">
        <div class="card-item__inner"><img src="./image/back.png" alt="Back Card"></div>
    </div>
    <div class="card-item" onclick="open3DModal('Lee Card', './image/lee.png')">
        <div class="card-item__inner"><img src="./image/lee.png" alt="Lee Card"></div>
    </div>
    <div class="card-item" onclick="open3DModal('Na Card', './image/na.png')">
        <div class="card-item__inner"><img src="./image/na.png" alt="Na Card"></div>
    </div>
    <div class="card-item" onclick="open3DModal('Park Card', './image/park.png')">
        <div class="card-item__inner"><img src="./image/park.png" alt="Park Card"></div>
    </div>
    <div class="card-item" onclick="open3DModal('Song Card', './image/song.png')">
        <div class="card-item__inner"><img src="./image/song.png" alt="Song Card"></div>
    </div>
    <div class="card-item" onclick="open3DModal('Kim Card', './image/kim.png')">
        <div class="card-item__inner"><img src="./image/kim.png" alt="Kim Card"></div>
    </div>
    <div class="card-item" onclick="open3DModal('Iu Card', './image/iu.png')">
        <div class="card-item__inner"><img src="./image/iu.png" alt="Iu Card"></div>
    </div>
</div>
    </div>

    <div class="modal" id="cardModal">
        <div class="modal__backdrop" onclick="closeModal()"></div>
        
        <div class="modal__content-wrapper">
            <div class="modal__card" id="modalCard">
                <div class="modal__card-inner" id="cardInner">
                    <div class="modal__card-face modal__card-front">
                        <img id="modalImg" src="" alt="Card">
                        <div class="modal__card-glare" id="modalGlare"></div>
                    </div>
                    <div class="modal__card-face modal__card-back"></div>
                </div>
            </div>

            <div class="modal__action">
                <button class="buy-modal-btn" onclick="buyCurrentCard()">🛒 카드 구매하기</button>
            </div>
        </div>
    </div>

    <script>
        let currentCardName = '', currentImgUrl = '';
        let isFlipped = false;

        function open3DModal(cardName, imgUrl) {
            currentCardName = cardName;
            currentImgUrl = imgUrl;
            document.getElementById('modalImg').src = imgUrl;
            document.getElementById('cardModal').classList.add('active');
            resetCard3D();
        }

        function closeModal() {
            document.getElementById('cardModal').classList.remove('active');
            resetCard3D();
        }

        function resetCard3D() {
            isFlipped = false;
            document.getElementById('cardInner').style.transform = 'rotateY(0deg)';
            document.getElementById('modalCard').style.transform = 'rotateX(0deg) rotateY(0deg)';
            document.getElementById('modalGlare').style.opacity = '0';
        }

        const modalCard = document.getElementById('modalCard');
        const modalGlare = document.getElementById('modalGlare');
        const cardInner = document.getElementById('cardInner');
        let cardRect = null;

        modalCard.addEventListener('mouseenter', () => {
            cardRect = modalCard.getBoundingClientRect();
        });

        modalCard.addEventListener('mousemove', (e) => {
            if (!cardRect) cardRect = modalCard.getBoundingClientRect();

            const x = e.clientX - cardRect.left;
            const y = e.clientY - cardRect.top;
            const centerX = cardRect.width / 2;
            const centerY = cardRect.height / 2;

            const rotateX = ((y - centerY) / centerY) * -18;
            const rotateY = ((x - centerX) / centerX) * 18;

            modalCard.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            modalGlare.style.opacity = '1';
            modalGlare.style.backgroundPosition = `${(x / cardRect.width) * 100}% ${(y / cardRect.height) * 100}%`;
        });

        modalCard.addEventListener('mouseleave', () => {
            cardRect = null;
            modalCard.style.transform = 'rotateX(0deg) rotateY(0deg)';
            modalGlare.style.opacity = '0';
        });

        modalCard.addEventListener('click', () => {
            isFlipped = !isFlipped;
            cardInner.style.transform = isFlipped ? 'rotateY(180deg)' : 'rotateY(0deg)';
        });

        async function buyCurrentCard() {
            if (!confirm(`${currentCardName}을(를) 구매하시겠습니까?`)) return;

            try {
                const response = await fetch('/api/cards/purchase', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cardName: currentCardName, imgUrl: currentImgUrl })
                });

                if (response.ok) {
                    alert('구매됨');
                    closeModal();
                } else {
                    alert('구매 실패');
                }
            } catch (err) {
                alert('서버 통신 오류가 발생했습니다.');
            }
        }
    </script>
</body>
</html>
