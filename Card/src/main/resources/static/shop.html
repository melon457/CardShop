<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD사이트 - 카드 상점</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background-color: #0b0d14;
            background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 24px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
            position: relative;
            color: #ffffff;
            padding-top: 100px;
            padding-bottom: 60px;
        }

        /* 배경 글로우 효과 */
        .bg-glow {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.22;
            pointer-events: none;
            z-index: 0;
        }
        .bg-glow--1 { top: -100px; left: 15%; background: radial-gradient(circle, #7928ca 0%, transparent 70%); }
        .bg-glow--2 { bottom: -100px; right: 15%; background: radial-gradient(circle, #0070f3 0%, transparent 70%); }

        /* 네비게이션 바 */
        .navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 70px;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(11, 13, 20, 0.75);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 500;
        }

        .navbar__logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .navbar__menu {
            display: flex;
            gap: 12px;
        }

        .nav-btn {
            text-decoration: none;
            background: transparent;
            border: 1px solid transparent;
            color: #a1a1aa;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .nav-btn:hover, .nav-btn.active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* 메인 컨테이너 */
        .shop-container {
            z-index: 1;
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            padding: 0 20px;
        }

        .shop-title {
            font-size: 2.2rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 카드 그리드 */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 35px 25px;
            width: 100%;
            justify-items: center;
        }

        @media (max-width: 900px) {
            .card-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            .card-grid { grid-template-columns: repeat(1, 1fr); }
        }

        /* 카드 아이템 & 3D 회전 */
        .card-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 220px;
            perspective: 1000px;
        }

        .card-inner {
            width: 220px;
            height: 310px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border-radius: 16px;
        }

        .card-item.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .card-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-back {
            background: rgba(20, 24, 38, 0.95);
            backdrop-filter: blur(20px);
            transform: rotateY(180deg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            gap: 16px;
        }

        .buy-btn {
            padding: 10px 24px;
            background: linear-gradient(135deg, #0070f3 0%, #7928ca 100%);
            border: none;
            border-radius: 20px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 112, 243, 0.4);
        }

        .buy-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(121, 40, 202, 0.6);
        }

        /* 카드 뒷면 별점 평가 UI */
        .rating-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
        }

        .rating-title {
            font-size: 13px;
            font-weight: 600;
            color: #e4e4e7;
        }

        .star-rating {
            display: flex;
            gap: 4px;
            cursor: pointer;
        }

        .star-rating .star {
            font-size: 22px;
            color: #4b5563;
            transition: color 0.15s ease;
            user-select: none;
        }

        .star-rating .star.active {
            color: #fbbf24;
            filter: drop-shadow(0 0 6px rgba(251, 191, 36, 0.6));
        }

        .submit-rating-btn {
            margin-top: 4px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .submit-rating-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* 카드 하단 평균 별점 표시 영역 (빨간 네모 박스 위치) */
        .card-avg-rating {
            margin-top: 10px;
            padding: 4px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            color: #fbbf24;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        /* BGM 버튼 위치 우측 하단 고정 */
        .bgm-btn {
            position: fixed !important;
            bottom: 24px !important;
            right: 24px !important;
            z-index: 9999 !important;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .bgm-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }
    </style>
</head>

    <!-- 자바스크립트 비즈니스 로직 -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. 페이지 로드 시 각 카드의 평균 별점 DB에서 불러오기
            const cardItems = document.querySelectorAll('.card-item');
            cardItems.forEach(item => {
                const cardName = item.getAttribute('data-card-name');
                if (cardName) {
                    loadAverageRating(cardName);
                }
            });

            // 2. 별점 클릭 인터랙션 설정
            setupStarRating();
        });

        // 카드 회전 함수
        function toggleCard(cardInner) {
            const cardItem = cardInner.parentElement;
            cardItem.classList.toggle('flipped');
        }

        // 별점 클릭 이벤트 설정
        function setupStarRating() {
            document.querySelectorAll('.star-rating').forEach(ratingContainer => {
                const stars = ratingContainer.querySelectorAll('.star');

                stars.forEach(star => {
                    star.addEventListener('click', (e) => {
                        e.stopPropagation(); // 카드 회전 동작 방지
                        const selectedValue = parseInt(star.getAttribute('data-value'));
                        ratingContainer.setAttribute('data-selected-rating', selectedValue);

                        stars.forEach(s => {
                            if (parseInt(s.getAttribute('data-value')) <= selectedValue) {
                                s.classList.add('active');
                            } else {
                                s.classList.remove('active');
                            }
                        });
                    });
                });
            });
        }

        // 별점 DB 저장 요청 (POST /api/ratings)
        function submitRating(cardName) {
            const ratingContainer = document.querySelector(`.star-rating[data-card="${cardName}"]`);
            const rating = ratingContainer ? parseInt(ratingContainer.getAttribute('data-selected-rating')) : 0;

            if (!rating || rating === 0) {
                alert("별점을 선택해주세요.");
                return;
            }

            fetch('/api/ratings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cardName: cardName, rating: rating })
            })
            .then(res => res.json())
            .then(data => {
                alert("별점이 성공적으로 등록되었습니다!");
                updateAvgDisplay(cardName, data.averageRating);
            })
            .catch(err => console.error("별점 등록 실패:", err));
        }

        // 서버에서 평균 별점 조회 (GET /api/ratings/{cardName}/average)
        function loadAverageRating(cardName) {
            fetch(`/api/ratings/${cardName}/average`)
            .then(res => res.json())
            .then(data => {
                updateAvgDisplay(cardName, data.averageRating);
            })
            .catch(err => console.error("평균 별점 조회 실패:", err));
        }

        // 사진 하단 영역에 평균 별점 업데이트
        function updateAvgDisplay(cardName, avgRating) {
            const avgScoreElem = document.querySelector(`#avg-rating-${cardName} .avg-score`);
            if (avgScoreElem) {
                avgScoreElem.textContent = `★ ${Number(avgRating).toFixed(1)}`;
            }
        }

        // 카드 구매 임시 함수 (필요 시 연동)
        function buyCard(cardName) {
            alert(`${cardName} 카드를 구매했습니다!`);
        }
    </script>
