<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카드 상점</title>
    <link rel="stylesheet" href="./css/style.css">
    <style>
        /* 모달 하단 구매 영역 스타일 추가 */
        .modal__action {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1002;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .buy-modal-btn {
            background: linear-gradient(135deg, #0070f3 0%, #7928ca 100%);
            color: #fff;
            border: none;
            padding: 12px 32px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 112, 243, 0.4);
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        .buy-modal-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 25px rgba(121, 40, 202, 0.6);
        }
    </style>
</head>
<body>
    <div class="bg-glow bg-glow--1"></div>
    <div class="bg-glow bg-glow--2"></div>

    <!-- 네비게이션 바 -->
    <header class="navbar">
        <div class="navbar__logo"><a href="./index.html" style="color:inherit; text-decoration:none;">CRUD사이트</a></div>
        <nav class="navbar__menu">
            <a href="./shop.html" class="nav-btn active">카드 상점</a>
            <a href="./collection.html" class="nav-btn">보관함</a>
            <a href="./sell.html" class="nav-btn">카드 판매</a>
            <a href="./reviews.html" class="nav-btn">상품평</a>
        </nav>
    </header>

    <div class="container">
        <div class="section-title">
            <h2>🛒 카드 상점</h2>
            <p>카드를 클릭하여 상세 모습을 확인하고 구매해 보세요.</p>
        </div>

        <!-- 카드 갤러리 목록 -->
        <div class="gallery">
            <div class="card-item" onclick="openModal('Lee Card', './image/lee.png')">
                <div class="card-item__inner"><img src="./image/lee.png" alt="Lee Card"></div>
            </div>
            <div class="card-item" onclick="openModal('Na Card', './image/na.png')">
                <div class="card-item__inner"><img src="./image/na.png" alt="Na Card"></div>
            </div>
            <div class="card-item" onclick="openModal('Park Card', './image/park.png')">
                <div class="card-item__inner"><img src="./image/park.png" alt="Park Card"></div>
            </div>
            <div class="card-item" onclick="openModal('Song Card', './image/song.png')">
                <div class="card-item__inner"><img src="./image/song.png" alt="Song Card"></div>
            </div>
        </div>
    </div>

    <!-- [중앙 팝업 모달] -->
    <div class="modal" id="cardModal">
        <div class="modal__backdrop" onclick="closeModal()"></div>
        <div class="modal__card" id="modalCard">
            <div class="modal__card-inner">
                <div class="modal__card-face modal__card-front">
                    <img id="modalImg" src="" alt="Card">
                    <div class="modal__card-glare"></div>
                </div>
            </div>
            <!-- 확대된 카드 하단 구매 버튼 -->
            <div class="modal__action">
                <button class="buy-modal-btn" onclick="buyCurrentCard()">🛒 카드 구매하기</button>
            </div>
        </div>
    </div>

    <script>
        let currentCardName = '';
        let currentImgUrl = '';

        // 1. 모달 열기 (기존 3D 상세보기 기능)
        function openModal(cardName, imgUrl) {
            currentCardName = cardName;
            currentImgUrl = imgUrl;

            document.getElementById('modalImg').src = imgUrl;
            document.getElementById('cardModal').classList.add('active');
        }

        // 2. 모달 닫기
        function closeModal() {
            document.getElementById('cardModal').classList.remove('active');
        }

        // 3. 확대된 상태에서 구매 버튼 클릭 시
        async function buyCurrentCard() {
            if (!confirm(`${currentCardName}을(를) 구매하시겠습니까?`)) return;

            try {
                const response = await fetch('/api/cards/purchase', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cardName: currentCardName,
                        imgUrl: currentImgUrl
                    })
                });

                if (response.ok) {
                    alert('성공적으로 구매되어 보관함(DB)에 저장되었습니다!');
                    closeModal();
                } else {
                    alert('구매에 실패했습니다.');
                }
            } catch (err) {
                console.error(err);
                alert('서버 통신 오류가 발생했습니다.');
            }
        }
    </script>
</body>
</html>
